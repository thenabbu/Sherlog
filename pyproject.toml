[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-sa"
version = "0.1.0"
description = "Offline supervisory analytics CLI for SOC assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
satsa = "sat_sa.cli:app"

[tool.setuptools.packages.find]
include = ["sat_sa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api:app"
